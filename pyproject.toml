[project]
name = "pump-control"
version = "0.1.0"
description = "Doover cloud processor: remote control for pumps, with an optional auto-fill role"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydoover>=1.18.2",
]

[project.scripts]
export-config = "pump_control.app_config:export"
export-ui = "pump_control.app_ui:export"
export-notifications = "pump_control.app_notifications:export"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pump_control"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
